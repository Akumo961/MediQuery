name: phase17-differentiation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  differentiation-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Phase 17 tests
        run: python -m pytest -q tests/test_phase17_differentiation.py
      - name: Formatting gate
        run: python -m black --check src tests app.py
      - name: Lint gate
        run: python -m flake8 src tests app.py --max-line-length=120
      - name: Compile gate
        run: python -m compileall -q src app.py
