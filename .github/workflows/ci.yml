name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-ci.txt
      - name: Format Python sources
        run: python -m black src tests app.py
      - run: python -m flake8 src tests app.py --max-line-length=120
      - run: python -m pytest -q
      - run: python -m compileall -q src app.py
      - name: Scan for common credential shapes
        run: |
          ! grep -RInE --exclude-dir=.git --exclude-dir=mediqueryvenv310 --exclude='*.ipynb' \
            '(AIza[0-9A-Za-z_-]{20,}|sk-[A-Za-z0-9_-]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' .
      - name: Commit formatter changes
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.actor != 'github-actions[bot]'
        run: |
          if git diff --quiet; then
            echo "No formatter changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests app.py
          git commit -m "style: apply Black formatting"
          git push
